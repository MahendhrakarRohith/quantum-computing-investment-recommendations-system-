<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Quant Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0B0E14', panelBg: '#151A22', quantPurple: '#8B5CF6' } } }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-panel { background: rgba(21, 26, 34, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glow-btn { background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); transition: all 0.3s ease; }
        .glow-btn:hover { box-shadow: 0 6px 25px rgba(139, 92, 246, 0.7); transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-darkBg text-slate-200 p-4">

    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-quantPurple rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-20 pointer-events-none"></div>

    <div class="glass-panel p-8 rounded-2xl w-full max-w-md relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-full bg-quantPurple mx-auto mb-4 flex items-center justify-center text-3xl shadow-[0_0_20px_rgba(139,92,246,0.5)] text-white"></div>
            <h1 class="text-2xl font-bold tracking-wider text-white" id="formTitle">SYSTEM LOGIN</h1>
            <p class="text-xs text-gray-400 font-mono tracking-widest uppercase mt-2">Nano Banana Core Engine</p>
        </div>

        <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg mb-4 text-sm font-mono text-center"></div>
        <div id="successBox" class="hidden bg-green-500/10 border border-green-500/50 text-green-400 p-3 rounded-lg mb-4 text-sm font-mono text-center"></div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Username</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-3 top-3.5 text-gray-500"></i>
                        <input type="text" id="username" required class="w-full bg-black/50 border border-gray-700 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-quantPurple transition-colors font-mono">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 uppercase tracking-wider mb-2">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-3.5 text-gray-500"></i>
                        <input type="password" id="password" required class="w-full bg-black/50 border border-gray-700 text-white rounded-lg pl-10 pr-4 py-3 focus:outline-none focus:border-quantPurple transition-colors font-mono">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full glow-btn text-white font-bold py-3 rounded-lg uppercase tracking-wider text-sm mb-4">
                Initialize Session
            </button>
        </form>

        <div class="text-center border-t border-gray-800 pt-4 mt-2">
            <p class="text-sm text-gray-400" id="toggleText">
                No clearance? <a href="#" onclick="toggleMode()" class="text-quantPurple hover:text-white transition-colors font-bold">Request Access (Sign Up)</a>
            </p>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').innerText = isLoginMode ? 'SYSTEM LOGIN' : 'CREATE ACCOUNT';
            document.getElementById('submitBtn').innerText = isLoginMode ? 'Initialize Session' : 'Register Credentials';
            document.getElementById('toggleText').innerHTML = isLoginMode ? 
                'No clearance? <a href="#" onclick="toggleMode()" class="text-quantPurple hover:text-white transition-colors font-bold">Request Access (Sign Up)</a>' : 
                'Have clearance? <a href="#" onclick="toggleMode()" class="text-quantPurple hover:text-white transition-colors font-bold">Authenticate (Log In)</a>';
            document.getElementById('errorBox').classList.add('hidden');
            document.getElementById('successBox').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const successBox = document.getElementById('successBox');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';
            errorBox.classList.add('hidden');
            successBox.classList.add('hidden');

            const endpoint = isLoginMode ? '/api/login' : '/api/signup';
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await response.json();

                if (data.error) {
                    errorBox.innerText = data.error;
                    errorBox.classList.remove('hidden');
                } else if (!isLoginMode) {
                    // Successful Signup
                    successBox.innerText = data.message;
                    successBox.classList.remove('hidden');
                    document.getElementById('authForm').reset();
                    setTimeout(toggleMode, 2000); // Switch to login mode
                } else {
                    // Successful Login
                    window.location.href = '/'; // Redirect to dashboard!
                }
            } catch (err) {
                errorBox.innerText = "Connection error to core engine.";
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = isLoginMode ? 'Initialize Session' : 'Register Credentials';
            }
        }
    </script>
</body>
</html>
